<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Braid | Iron Sharpens Iron</title>
    <style>
        :root {
            --bg-color: #0F0F13;
            --surface-color: #1A1A20;
            --primary-color: #CFA66E;
            --text-main: #FFFFFF;
            --text-secondary: #8E8E93;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .logo-container {
            width: 100px;
            height: 100px;
            background-color: var(--surface-color);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem auto;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .logo-text {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #FFF, #CFA66E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 1rem;
            line-height: 1.1;
        }

        p.subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            line-height: 1.5;
            font-weight: 400;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-color);
            color: #000;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 24px rgba(207, 166, 110, 0.25);
            gap: 12px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(207, 166, 110, 0.4);
        }

        .download-btn svg {
            width: 24px;
            height: 24px;
        }

        .footer {
            margin-top: 4rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .beta-badge {
            display: inline-block;
            background-color: rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            border: 1px solid rgba(207, 166, 110, 0.3);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            p.subtitle { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="beta-badge">Early Access Beta</div>
        
        <div class="logo-container">
            <div class="logo-text">B</div>
        </div>

        <h1>Braid.</h1>
        <p class="subtitle">A community of believers growing together.<br>As iron sharpens iron, so one person sharpens another.</p>

        <a href="Braid-Beta-v1.apk" class="download-btn" download>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download for Android
        </a>

        <div class="footer">
            Braid Beta v1.0 &copy; 2026. All rights reserved.
        </div>
    </div>

</body>
</html>
