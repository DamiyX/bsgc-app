<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Braid | Iron Sharpens Iron</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFFFFF;
            --surface-color: #F8F9FA;
            --primary-color: #8E54E9;
            --text-main: #2A2A2A;
            --text-secondary: #757575;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comfortaa', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .logo-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 2rem auto;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(142, 84, 233, 0.2);
            background-color: transparent;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scale(1.68) translateX(-3%);
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 1rem;
            line-height: 1.1;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 1.25rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            line-height: 1.5;
            font-weight: 600;
        }

        p.scripture {
            font-size: 1rem;
            color: var(--primary-color);
            font-style: italic;
            margin-bottom: 3rem;
            line-height: 1.5;
            font-weight: 500;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #D4B8FB, #8E54E9);
            color: #FFFFFF;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 24px rgba(142, 84, 233, 0.3);
            gap: 12px;
            border: none;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(142, 84, 233, 0.5);
        }

        .download-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
        }

        .footer {
            margin-top: 4rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .beta-badge {
            display: inline-block;
            background-color: #F3E5F5;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #8E54E9;
            border: 1px solid rgba(142, 84, 233, 0.2);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            p.subtitle { font-size: 1.15rem; }
            p.scripture { font-size: 0.95rem; }
            .logo-container { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="beta-badge">Early Access Beta</div>
        
        <div class="logo-container">
            <img src="logo.png" alt="Braid Logo">
        </div>

        <h1>Braid.</h1>
        <p class="subtitle">A community of believers growing together.</p>
        <p class="scripture">"As iron sharpens iron, so one person sharpens another."</p>

        <a href="Braid-App-v2.0.apk" class="download-btn" download="Braid-App-v2.0.apk">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download for Android
        </a>

        <div class="footer">
            Braid Beta v2.0 &copy; 2026. All rights reserved.
        </div>
    </div>

</body>
</html>
