name: Signed Android release

on:
  workflow_dispatch:

concurrency:
  group: braid-android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  app-bundle:
    runs-on: ubuntu-latest
    environment: android-release
    env:
      # The checked-in profile protects local machines; the protected release
      # runner gets a larger heap for the signed/R8 build.
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6G"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - name: Capture release toolchain
        run: |
          mkdir -p build/release-evidence
          {
            echo "commit: $(git rev-parse HEAD)"
            echo "ref: ${GITHUB_REF}"
            echo "sha: ${GITHUB_SHA}"
            echo "pubspec-version: $(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
            echo "flutter:"
            flutter --version
            echo "java:"
            java -version 2>&1
          } > build/release-evidence/toolchain.txt
      - name: Require signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          test -n "$ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
      - name: Configure signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/braid-upload.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ALIAS"
            printf 'storeFile=app/braid-upload.jks\n'
          } > android/key.properties
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build appbundle --release --analyze-size --target-platform android-arm64 --dart-define=BRAID_ENV=production
      - name: Record Gradle wrapper version
        run: |
          test -x android/gradlew
          {
            echo "gradle:"
            (cd android && ./gradlew --version)
          } >> build/release-evidence/toolchain.txt
      - name: Build arm64 device APK and analyze size
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --analyze-size --dart-define=BRAID_ENV=production --no-pub
      - name: Record release evidence
        run: |
          set -eu
          evidence=build/release-evidence
          aab=build/app/outputs/bundle/release/app-release.aab
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f "$aab"
          test -f "$apk"
          sha256sum "$aab" "$apk" > "$evidence/artifact-sha256.txt"
          {
            echo "artifact"
            find build/app/outputs -type f \( -name '*.aab' -o -name '*.apk' \) -printf '%p\t%s bytes\n' | sort
            echo
            echo "size-analysis-files"
            find "$HOME/.flutter-devtools" build -type f -iname '*size*.json' -print 2>/dev/null | sort -u
          } > "$evidence/artifact-inventory.txt"
          size_files=$(find "$HOME/.flutter-devtools" build -type f -iname '*size*.json' -print 2>/dev/null | sort -u)
          if [ -n "$size_files" ]; then
            printf '%s\n' "$size_files" | while IFS= read -r file; do
              [ -n "$file" ] || continue
              cp "$file" "$evidence/$(basename "$file")"
            done
          else
            echo 'No Flutter size-analysis JSON was emitted; the release evidence gate cannot pass.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: braid-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: braid-release-evidence
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/mapping/release/**
            build/app/outputs/native-debug-symbols/release/**
            build/release-evidence/**
          if-no-files-found: error
          retention-days: 14
