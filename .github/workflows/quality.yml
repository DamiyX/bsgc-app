name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    env:
      # CI runners have more headroom than a contributor laptop; keep the
      # local Gradle profile conservative while allowing release smoke builds
      # to use the runner's capacity.
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6G"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Android debug compile smoke
        run: flutter build apk --debug --target-platform android-arm64 --split-per-abi --no-pub

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  security-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run test:rules
